name: LabyAddon Build

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Minecraft 26.1+ requires Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Use the Git tag as the addon version.
      - name: Use the tag as the addon version
        if: github.ref_type == 'tag'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Compile all addon modules.
      - name: Build with Gradle
        run: ./gradlew build --full-stacktrace

      # Generate the combined production addon.
      - name: Create Release Artifact
        run: ./gradlew createReleaseJar

      # Rename the production JAR.
      - name: Rename release JAR
        shell: bash
        run: |
          release_jar=$(find build/libs -maxdepth 1 -type f -name '*-release.jar' ! -name 'OfflineCosmeticsLabyMod-release.jar' -print -quit)

          if [ -z "$release_jar" ]; then
            echo "No release JAR was generated!"
            exit 1
          fi

          mv "$release_jar" build/libs/OfflineCosmeticsLabyMod-release.jar

      # Upload the finished addon to GitHub Actions.
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OfflineCosmeticsLabyMod
          path: build/libs/OfflineCosmeticsLabyMod-release.jar
          if-no-files-found: error

      # Publish a GitHub release when a version tag is pushed.
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/OfflineCosmeticsLabyMod-release.jar --title "$GITHUB_REF_NAME" --generate-notes
