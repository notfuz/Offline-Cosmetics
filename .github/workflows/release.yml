name: Publish Release

# Publishes a GitHub release for every version tag. The build itself stays in build.yml.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Minecraft 26.1+ requires Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          validate-wrappers: true
          cache-read-only: true

      # Use the Git tag as the addon version.
      - name: Use the tag as the addon version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create Release Artifact
        run: ./gradlew build createReleaseJar --full-stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_jar=$(find build/libs -maxdepth 1 -type f -name '*-release.jar' -print -quit)

          if [ -z "$release_jar" ]; then
            echo "No release JAR was generated!"
            exit 1
          fi

          mv "$release_jar" build/libs/OfflineCosmeticsLabyMod-release.jar
          gh release create "$GITHUB_REF_NAME" build/libs/OfflineCosmeticsLabyMod-release.jar --title "$GITHUB_REF_NAME" --generate-notes
